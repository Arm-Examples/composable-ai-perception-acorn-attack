# Built by acorn-attack-web-server; perception-service mounts its /models.
x-model-image: &model-image acorn-attack-web-server:local

services:
  messaging-service:
    platform: linux/arm64
    image: armlimited/arm-cairn-messaging-service:0.0.2
    ports: ["127.0.0.1:6379:6379", "127.0.0.1:50054:50054"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
  camera-service:
    platform: linux/arm64
    image: armlimited/arm-cairn-camera-service:0.0.2
    user: root
    entrypoint: ["/usr/local/bin/permissions-set-entrypoint.sh"]
    network_mode: host
    group_add: [video]
    cap_add: [SYS_NICE]
    device_cgroup_rules: ["c *:* rw"]
    volumes:
      - pipewire-runtime:/run/pipewire
      - /dev:/dev
      - /run/udev:/run/udev:ro
    depends_on:
      messaging-service:
        condition: service_healthy
  perception-service:
    platform: linux/arm64
    image: armlimited/arm-cairn-perception-service:0.0.2
    ports: ["127.0.0.1:50053:50053"]
    depends_on:
      messaging-service:
        condition: service_healthy
    volumes:
      - pipewire-runtime:/run/pipewire:ro
      - type: image
        source: *model-image
        target: /models
        read_only: true
        image:
          subpath: models
  acorn-attack-web-server:
    platform: linux/arm64
    image: *model-image
    build:
      context: .
      args:
        OPK_HF_DETECTION_MODEL: Arm/ultraface-rfb-320-onnx-raspberry
        DETECTION_LABEL: ""
    network_mode: host
    depends_on:
      camera-service:
        condition: service_healthy
      perception-service:
        condition: service_healthy
    restart: "no"
volumes:
  pipewire-runtime:

x-topo:
  name: Cairn Perception Acorn Attack Game
  type: application
  description: A browser based game played with a camera and an object detection inference model.
  deployment_success_message: "Play the game: http://${TOPO_TARGET_HOSTNAME}:8000"
  parameters:
    OPK_HF_DETECTION_MODEL:
      description: Hugging Face repository for the object-detection model. The game will be played with anything your model detects.
      required: false
      default: Arm/ultraface-rfb-320-onnx-raspberry
      example: https://huggingface.co/Arm/ultraface-rfb-320-onnx-raspberry
      hints:
        meta.type: huggingface.repo-id
        meta.compatibility: opk
        model.task: object-detection
        model.format: onnx
    DETECTION_LABEL:
      description: Only play with detections of this label, such as person or chair. Leave empty to use every detection.
      required: false
      example: chair
