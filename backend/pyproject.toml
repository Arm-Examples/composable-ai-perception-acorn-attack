[project]
name = "cairn-perception-acorn-attack"
version = "0.0.0"
requires-python = ">=3.13.17,<3.14"
dependencies = [
    "arm-cairn==0.0.2",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
]

[dependency-groups]
dev = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.0",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

