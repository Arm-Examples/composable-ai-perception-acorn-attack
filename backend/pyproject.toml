[project]
name = "cairn-perception-acorn-attack"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "cairn-sdk-lib==0.0.2",
    "fastapi==0.141.1",
    "opk-perception-sdk==0.3.0",
    "protobuf==7.35.1",
    "uvicorn[standard]==0.53.0",
]

[dependency-groups]
dev = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.0",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
cairn-sdk-lib = { index = "edge-ai-tooling" }
opk-perception-sdk = { index = "edge-ai-tooling" }

[[tool.uv.index]]
name = "edge-ai-tooling"
url = "https://artifactory.arm.com/artifactory/api/pypi/edge-ai-tooling.pypi/simple"
explicit = true
